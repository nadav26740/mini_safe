[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-safe"
version = "1.0.0"
description = "A terminal-based password and data safe"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "nadav26740" }]
dependencies = [
    "bcrypt>=5.0.0",
    "cryptography>=42.0.0",
    "pyperclip>=1.8.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "textual-dev>=1.0.0",
    "textual-serve>=1.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
]

[project.scripts]
mini-safe = "TUI_main:main"
mini-safe-cli = "CLI_Main:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["CLI_Main", "TUI_main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "tui*"]
